version: 2
models:
- name: stg_customers
  columns:
  - name: _event_id
    data_tests:
    - unique
    - not_null
  - name: customer_id
    data_tests:
    - not_null
  - name: _op
    data_tests:
    - accepted_values:
        arguments:
          values:
          - I
          - U
          - D
  - name: _source_order
    data_tests:
    - not_null
- name: stg_orders
  columns:
  - name: _event_id
    data_tests:
    - unique
    - not_null
  - name: order_id
    data_tests:
    - not_null
  - name: _op
    data_tests:
    - accepted_values:
        arguments:
          values:
          - I
          - U
          - D
  - name: _source_order
    data_tests:
    - not_null
- name: stg_order_items
  columns:
  - name: _event_id
    data_tests:
    - unique
    - not_null
  - name: order_item_key
    data_tests:
    - not_null
  - name: _op
    data_tests:
    - accepted_values:
        arguments:
          values:
          - I
          - U
          - D
  - name: _source_order
    data_tests:
    - not_null
- name: stg_order_payments
  columns:
  - name: _event_id
    data_tests:
    - unique
    - not_null
  - name: payment_key
    data_tests:
    - not_null
  - name: _op
    data_tests:
    - accepted_values:
        arguments:
          values:
          - I
          - U
          - D
  - name: _source_order
    data_tests:
    - not_null
- name: dim_customers
  columns:
  - name: customer_id
    data_tests:
    - unique
    - not_null
- name: dim_customer_history
  columns:
  - name: customer_version_id
    data_tests:
    - unique
    - not_null
- name: fct_orders
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
  - name: customer_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customers')
          field: customer_id
  - name: customer_version_id
    description: Observed customer version at the latest captured order INSERT; NULL if history is unknown.
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_customer_history')
          field: customer_version_id
  - name: customer_history_status
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: [matched, creation_not_captured, customer_history_unavailable]
- name: fct_order_items
  columns:
  - name: order_item_key
    data_tests:
    - unique
    - not_null
  - name: order_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
- name: fct_order_payments
  columns:
  - name: payment_key
    data_tests:
    - unique
    - not_null
  - name: order_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('fct_orders')
          field: order_id
- name: fct_order_status_history
  description: Observed status transitions since capture began, including deletion markers.
  columns:
  - name: order_status_version_id
    data_tests: [unique, not_null]
  - name: order_id
    data_tests: [not_null]
  - name: status
    data_tests: [not_null]
