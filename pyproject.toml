[project]
name = "olist-cdc"
version = "0.1.0"
description = "A student portfolio project for e-commerce orders CDC"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.35,<2",
    "dbt-postgres>=1.9,<2",
    "dbt-redshift>=1.9,<2",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=25.0.1,<26",
    "python-dotenv>=1.0,<2",
    "redshift-connector>=2.1,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
olist-cdc = "olist_cdc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the local project PostgreSQL container"]
