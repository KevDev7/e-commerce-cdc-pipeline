[project]
name = "synthea-cdc"
version = "0.1.0"
description = "A student portfolio project for healthcare billing CDC"
requires-python = ">=3.12,<3.14"
dependencies = ["psycopg[binary]>=3.2,<4", "python-dotenv>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[project.scripts]
synthea-cdc = "synthea_cdc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the local project PostgreSQL container"]

